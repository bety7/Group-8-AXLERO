services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-metricmind}
      POSTGRES_PASSWORD: ${PGPASSWORD:-metricmind}
      POSTGRES_DB: ${PGDATABASE:-metricmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-metricmind}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=postgres
      - CUBEJS_DB_PORT=5432
      - CUBEJS_DB_NAME=${PGDATABASE:-metricmind}
      - CUBEJS_DB_USER=${PGUSER:-metricmind}
      - CUBEJS_DB_PASS=${PGPASSWORD:-metricmind}
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-change-me}
      - CUBEJS_CACHE_AND_QUEUE_DRIVER=memory
      # --- Snowflake instead of Postgres: replace the CUBEJS_DB_* lines with ---
      # CUBEJS_DB_TYPE=snowflake, CUBEJS_DB_SNOWFLAKE_ACCOUNT, CUBEJS_DB_SNOWFLAKE_WAREHOUSE,
      # CUBEJS_DB_NAME, CUBEJS_DB_USER, CUBEJS_DB_PASS
    volumes:
      - ./cube/model:/cube/conf/model
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
